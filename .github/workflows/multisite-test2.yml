name: ClipCatch multisite TEST2 Windows build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/multisite_video_test.mjs'
      - '.github/workflows/multisite-test2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    if: github.head_ref == 'test/multisite-2.0.1-test3'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser URL regression
        shell: pwsh
        run: |
          node --test tests/multisite_video_test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser URL test failed' }
      - name: Site resolver tests and full Go static checks
        shell: pwsh
        working-directory: src
        run: |
          go test -count=1 -timeout=3m -run '^Test(HLSUsesFFmpegWhileDirectMP4AndDASHKeepExistingDownloader|AssemblyOfficialMetadataResolution|NaverOfficialPlaybackMetadataAndSeparateAudio|MediaURLSafetyAndInfoFileCleanup|OfficialVideoPagesRetainParameters|NewPublicVideoPages|TrialExtensionIsolatedFromStableSource)$' .
          if ($LASTEXITCODE -ne 0) { throw 'Official site resolver tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
      - name: Live public video metadata check (non-blocking if provider denies CI access)
        continue-on-error: true
        shell: pwsh
        working-directory: src
        env:
          CLIPCATCH_SITE_LIVE: '1'
        run: |
          go test -run '^TestLiveOfficialSitePlaybackMetadata$' -count=1 -v -timeout=3m .
          if ($LASTEXITCODE -ne 0) { throw 'Live provider playback check failed; see limitations' }
      - name: Prepare TEST2 Windows metadata and icon
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow failed' }
          python tools/windows_resources.py --version 2.0.1-test.5 --test2
          if ($LASTEXITCODE -ne 0) { throw 'Windows resources failed' }
      - name: Build isolated TEST2 GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-test2 | Out-Null
          $env:CGO_ENABLED='0'
          Push-Location src
          try {
            go build -trimpath '-ldflags=-s -w -H windowsgui -X main.appVersion=2.0.1-test.5 -X main.appChannel=test' -o ../dist-test2/ClipCatch-Test2.exe .
            if ($LASTEXITCODE -ne 0) { throw 'Go Windows EXE build failed' }
          } finally { Pop-Location }
          $exe = (Resolve-Path dist-test2/ClipCatch-Test2.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList @('--build-info', (Join-Path (Get-Location) 'dist-test2\identity.json')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Windows identity check failed' }
          $info = Get-Content dist-test2/identity.json -Raw | ConvertFrom-Json
          if ($info.app -ne 'clipcatch-test2' -or $info.channel -ne 'test' -or $info.version -ne '2.0.1-test.5') {
            throw 'Wrong build identity - production protection'
          }
          $meta = (Get-Item $exe).VersionInfo
          if ($meta.FileDescription -ne 'ClipCatch TEST2' -or $meta.OriginalFilename -ne 'ClipCatch-Test2.exe') {
            throw 'Wrong Windows metadata'
          }
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  ClipCatch-Test2.exe' | Set-Content dist-test2/SHA256SUMS -Encoding ascii
          Remove-Item dist-test2/identity.json
      - name: Upload TEST2 only, not a stable release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCatch-TEST2-multisite-2.0.1-test.5
          path: dist-test2/
          if-no-files-found: error
          retention-days: 7
