name: ClipCatch site structure diagnostic (no media download)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/site-structure-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-pages:
    if: github.head_ref == 'test/multisite-2.0.1-test3'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public page structure; no cookies; no video/media downloads
        shell: pwsh
        run: |
          @'
          from html.parser import HTMLParser
          from urllib.parse import urlparse, urljoin, urlunparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import re
          PAGES = [
            ("assembly-user", "https://w3.assembly.go.kr/main/player.do?menu=10&mc=10&ct1=22&ct2=439&ct3=11&wv=1"),
            ("assembly-old", "https://w3.assembly.go.kr/main/player.do?menu=30&mc=345&ct1=22&ct2=439&ct3=V2&wv=1"),
            ("naver-clip-home", "https://clip.naver.com/contents"),
            ("naver-shorts-home", "https://m.naver.com/shorts/"),
            ("naver-tv-public", "https://tv.naver.com/v/19961840"),
          ]
          def safe_link(s):
            try:
              p=urlparse(s)
              return p.scheme+"://"+p.netloc+p.path
            except Exception:
              return "[unparseable]"
          class Parser(HTMLParser):
            def __init__(self):
              super().__init__();self.tags=[];self.scripts=[]
            def handle_starttag(self, tag, attrs):
              a=dict(attrs); u=a.get("src") or a.get("content") or a.get("href") or ""
              if tag in ("script","video","source","iframe","meta") and u:
                self.tags.append((tag,safe_link(u)))
                if tag=="script" and a.get("src"):self.scripts.append(a["src"])
          def get(u,timeout=12):
            q=Request(u,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36","Accept-Language":"ko-KR,ko;q=0.9","Accept":"text/html,application/xhtml+xml"})
            with urlopen(q,timeout=timeout) as r:
              typ=r.headers.get("content-type","")
              return r.status, safe_link(r.url), typ, r.read(650000)
          for name,url in PAGES:
            print("\nPAGE",name,safe_link(url))
            try:
              status,final,typ,raw=get(url)
              print("HTTP",status,"final",final,"type",typ,"bytes",len(raw))
              html=raw.decode("utf-8","replace")
              p=Parser();p.feed(html)
              print("RESOURCE TAGS",p.tags[:28])
              print("SCRIPT COUNT",len(p.scripts))
              print("MARKERS",{x:len(re.findall(x,html,re.I)) for x in [r"m3u8",r"\.mp4",r"\.mpd",r"video",r"iframe",r"player",r"vod",r"videoId",r"inKey",r"__NEXT_DATA__",r"clipId"]})
              for keyword in [r'm3u8',r'\.mp4',r'vod',r'playerUrl',r'videoId',r'inKey',r'iframe',r'video',r'<source']:
                m=re.search(keyword,html,re.I)
                if m:
                  snip=html[max(0,m.start()-130):m.end()+220]
                  snip=re.sub(r"https?://[^\s\"'<>]+",lambda m:safe_link(m.group(0)),snip)
                  snip=re.sub(r"[A-Za-z0-9_=/-]{80,}","[long-token-redacted]",snip)
                  print("HINT",keyword,repr(snip[:350]))
              if name.startswith("assembly"):
                for js in p.scripts[-12:]:
                  full=urljoin(url,js)
                  try:
                    ss,ff,tt,bb=get(full,timeout=8)
                    if "javascript" not in tt and ".js" not in ff:continue
                    body=bb.decode("utf-8","replace")
                    print("JS",safe_link(full),"bytes",len(bb),"markers",{x:body.lower().count(x.lower()) for x in ['m3u8','.mp4','vod','player','videoUrl','stream']})
                  except Exception as e:
                    print("JS ERROR",safe_link(full),type(e).__name__)
            except Exception as e:
              print("ERROR",type(e).__name__,str(e)[:180])
          '@ | python -
